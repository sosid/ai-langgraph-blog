apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-access
  namespace: mos-step-1
data:
  pg_hba.conf: |
    local all all trust
    hostssl all all all scram-sha-256
    hostnossl all all all reject
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: mos-step-1
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      serviceAccountName: booking
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
          args:
            - postgres
            - -c
            - ssl=on
            - -c
            - ssl_cert_file=/tls/tls.crt
            - -c
            - ssl_key_file=/tls/tls.key
            - -c
            - hba_file=/etc/postgresql/pg_hba.conf
          env:
            - name: POSTGRES_DB
              value: booking
            - name: POSTGRES_USER
              value: booking
            - name: POSTGRES_INITDB_ARGS
              value: --auth-host=scram-sha-256
            - name: POSTGRES_PASSWORD_FILE
              value: /credentials/password
          ports:
            - name: postgres
              containerPort: 5432
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          startupProbe:
            exec:
              command: [pg_isready, -U, booking, -d, booking]
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            exec:
              command: [pg_isready, -U, booking, -d, booking]
            periodSeconds: 3
          livenessProbe:
            exec:
              command: [pg_isready, -U, booking, -d, booking]
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: tls
              mountPath: /tls
              readOnly: true
            - name: credentials
              mountPath: /credentials
              readOnly: true
            - name: access
              mountPath: /etc/postgresql
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
        - name: tls
          secret:
            secretName: postgres-tls
            defaultMode: 0440
        - name: credentials
          secret:
            secretName: database
            defaultMode: 0440
        - name: access
          configMap:
            name: postgres-access
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: mos-step-1
spec:
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: mos-step-1
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: booking
  template:
    metadata:
      labels:
        app: booking
    spec:
      serviceAccountName: booking
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: booking
          image: miles-of-smiles/booking:step-1
          imagePullPolicy: Never
          env:
            - name: QUARKUS_PROFILE
              value: tls
            - name: DB_URL
              value: jdbc:postgresql://postgres:5432/booking?sslmode=verify-full&sslrootcert=/tls/ca.crt
            - name: DB_USERNAME
              value: booking
            - name: DB_PASSWORD_FILE
              value: /credentials/password
            - name: TLS_DIR
              value: /tls
            - name: QUARKUS_HTTP_SSL_CERTIFICATE_FILES
              value: /tls/tls.crt
            - name: QUARKUS_HTTP_SSL_CERTIFICATE_KEY_FILES
              value: /tls/tls.key
          ports:
            - name: https
              containerPort: 8443
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          startupProbe:
            httpGet: {scheme: HTTPS, path: /q/health/live, port: https}
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet: {scheme: HTTPS, path: /q/health/ready, port: https}
            periodSeconds: 3
          livenessProbe:
            httpGet: {scheme: HTTPS, path: /q/health/live, port: https}
            periodSeconds: 10
          volumeMounts:
            - name: tls
              mountPath: /tls
              readOnly: true
            - name: credentials
              mountPath: /credentials
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tls
          secret:
            secretName: app-tls
            defaultMode: 0440
        - name: credentials
          secret:
            secretName: database
            defaultMode: 0440
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: mos-step-1
  annotations:
    haproxy.org/ssl-passthrough: "true"
spec:
  selector:
    app: booking
  ports:
    - name: https
      port: 8443
      targetPort: https
