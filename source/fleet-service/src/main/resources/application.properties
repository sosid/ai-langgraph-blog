quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.enabled=false
quarkus.datasource.username=${DB_USERNAME}
quarkus.datasource.password=${DB_PASSWORD}
quarkus.datasource.jdbc.url=${DB_URL}
quarkus.datasource.jdbc.min-size=0
quarkus.datasource.jdbc.max-size=4
quarkus.datasource.jdbc.acquisition-timeout=3S
quarkus.datasource.jdbc.login-timeout=3S
quarkus.datasource.jdbc.validation-query-sql=SELECT 1
quarkus.datasource.jdbc.validation-query-timeout=2S
quarkus.datasource.jdbc.validate-on-borrow=true
quarkus.datasource.jdbc.additional-jdbc-properties.connectTimeout=3
quarkus.datasource.jdbc.additional-jdbc-properties.socketTimeout=3
quarkus.http.host=127.0.0.1
quarkus.http.access-log.enabled=false

%tls.quarkus.http.host=0.0.0.0
%tls.quarkus.http.insecure-requests=disabled
%tls.quarkus.http.ssl-port=8443
%tls.quarkus.http.ssl.certificate.files=${TLS_DIR}/server.crt
%tls.quarkus.http.ssl.certificate.key-files=${TLS_DIR}/server.key
